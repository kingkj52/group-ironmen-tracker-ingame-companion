plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net[.]runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.groupironmencompanion.GroupIronmenCompanionPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.groupironmencompanion'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs << '-Xlint:deprecation'
}

// Launches a dev client with this plugin loaded. Requires developer mode.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// Copies the built jar into the sideloaded-plugins folder, clearing out older
// builds of this plugin first so two versions can never load side by side.
tasks.register('deploy', Copy) {
	dependsOn tasks.jar
	def target = file("${System.getProperty('user.home')}/.runelite/sideloaded-plugins")
	doFirst {
		target.mkdirs()
		target.listFiles()?.each { f ->
			if (f.name.startsWith('group-ironmen-companion')) {
				delete f
			}
		}
	}
	from tasks.jar
	into target
}
