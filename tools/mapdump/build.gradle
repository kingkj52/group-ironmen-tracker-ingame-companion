plugins {
	id 'java'
	id 'application'
}

repositories {
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

dependencies {
	implementation group: 'net.runelite', name: 'cache', version: 'latest.release'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'org.slf4j:slf4j-simple:1.7.36'
}

application {
	mainClass = 'AreaDump'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Prints which map regions have terrain in a square range, for reading a detached area's
// real extent off the cache instead of inferring it from a single observed position.
tasks.register('regionProbe', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'RegionProbe'
}

tasks.register('locProbe', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'LocProbe'
}
